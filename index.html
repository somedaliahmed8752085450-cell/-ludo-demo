
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>ডেমো লুডো</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f0f0f0;
        margin: 0;
        padding: 20px;
    }
    h1 { color: #333; }
    #board {
        display: inline-grid;
        grid-template-columns: repeat(15, 30px);
        grid-template-rows: repeat(15, 30px);
        gap: 1px;
        background: #333;
        border: 4px solid #333;
        margin: 20px auto;
    }
    .cell {
        width: 30px;
        height: 30px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
    }
    .red { background: #ff6b6b; }
    .green { background: #51cf66; }
    .yellow { background: #ffd43b; }
    .blue { background: #339af0; }
    .path { background: #e9ecef; }
    .safe { background: #adb5bd; }
    .home { background: #495057; color: white; }
    .center { background: #212529; color: white; }
    #controls {
        margin: 20px;
    }
    button {
        padding: 12px 24px;
        font-size: 18px;
        margin: 0 10px;
        cursor: pointer;
        background: #228be6;
        color: white;
        border: none;
        border-radius: 8px;
    }
    button:hover { background: #1c7ed6; }
    #dice {
        font-size: 48px;
        margin: 10px;
        height: 60px;
    }
    #info {
        font-size: 18px;
        margin: 10px;
        font-weight: bold;
    }
    .piece {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #000;
        display: inline-block;
    }
    .p-red { background: #c92a2a; }
    .p-green { background: #2f9e44; }
    .p-yellow { background: #f08c00; }
    .p-blue { background: #1971c2; }
</style>
</head>
<body>

<h1>🎲 ডেমো লুডো</h1>
<p>এটা একটা সিম্পল ডেমো (২ জন খেলোয়াড় - লাল ও সবুজ)</p>

<div id="info">লাল খেলোয়াড়ের পালা</div>
<div id="dice">🎲</div>

<div id="controls">
    <button onclick="rollDice()">ডাইস রোল করুন</button>
    <button onclick="resetGame()">রিসেট</button>
</div>

<div id="board"></div>

<script>
const board = document.getElementById('board');
const info = document.getElementById('info');
const diceEl = document.getElementById('dice');

let currentPlayer = 'red'; // red or green
let diceValue = 0;
let canRoll = true;

// সিম্পল পথ (শুধু লাল ও সবুজের জন্য)
const redPath = [];
const greenPath = [];

// বোর্ড তৈরি
function createBoard() {
    board.innerHTML = '';
    for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = row;
            cell.dataset.col = col;

            // রঙিন ঘর
            if (row < 6 && col < 6) cell.classList.add('red');
            else if (row < 6 && col > 8) cell.classList.add('green');
            else if (row > 8 && col < 6) cell.classList.add('yellow');
            else if (row > 8 && col > 8) cell.classList.add('blue');
            else if (row >= 6 && row <= 8 && col >= 6 && col <= 8) cell.classList.add('center');
            else cell.classList.add('path');

            // সেফ জোন
            if ((row === 1 && col === 6) || (row === 6 && col === 1) ||
                (row === 6 && col === 13) || (row === 13 && col === 6) ||
                (row === 8 && col === 2) || (row === 2 && col === 8) ||
                (row === 12 && col === 8) || (row === 8 && col === 12)) {
                cell.classList.add('safe');
            }

            board.appendChild(cell);
        }
    }
}

// গুটি রাখার জন্য সাধারণ পজিশন
let pieces = {
    red: [{pos: -1}, {pos: -1}, {pos: -1}, {pos: -1}],   // -1 = ঘরে
    green: [{pos: -1}, {pos: -1}, {pos: -1}, {pos: -1}]
};

function rollDice() {
    if (!canRoll) return;
    diceValue = Math.floor(Math.random() * 6) + 1;
    diceEl.textContent = ['','⚀','⚁','⚂','⚃','⚄','⚅'][diceValue];
    
    info.textContent = `${currentPlayer === 'red' ? 'লাল' : 'সবুজ'} খেলোয়াড় রোল করেছে: ${diceValue}`;
    
    // সিম্পল লজিক: ৬ পেলে গুটি বের হতে পারে
    if (diceValue === 6) {
        info.textContent += " → গুটি বের করতে পারেন!";
    }
    
    canRoll = false;
    
    // ২ সেকেন্ড পর অন্য প্লেয়ার
    setTimeout(() => {
        currentPlayer = currentPlayer === 'red' ? 'green' : 'red';
        info.textContent = `${currentPlayer === 'red' ? 'লাল' : 'সবুজ'} খেলোয়াড়ের পালা`;
        canRoll = true;
        diceEl.textContent = '🎲';
    }, 1800);
}

function resetGame() {
    currentPlayer = 'red';
    canRoll = true;
    diceValue = 0;
    diceEl.textContent = '🎲';
    info.textContent = 'লাল খেলোয়াড়ের পালা';
    pieces = {
        red: [{pos: -1}, {pos: -1}, {pos: -1}, {pos: -1}],
        green: [{pos: -1}, {pos: -1}, {pos: -1}, {pos: -1}]
    };
}

createBoard();
</script>
</body>
</html>
